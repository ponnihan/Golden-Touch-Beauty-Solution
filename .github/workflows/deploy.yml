name: Deploy Golden Touch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ./golden-touch 2
        run: npm install

      - name: Build website
        working-directory: ./golden-touch 2
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
        run: npm run build

      - name: Prepare direct routes for GitHub Pages
        run: |
          set -e
          DIST="golden-touch 2/dist"
          test -f "$DIST/index.html"
          mkdir -p "$DIST/solutions" "$DIST/categories" "$DIST/journal" "$DIST/product"
          for route in acne oily-skin dry-skin visible-pores pigmentation sun-damage dullness ageing hair-fall dandruff; do
            mkdir -p "$DIST/solutions/$route"
            cp "$DIST/index.html" "$DIST/solutions/$route/index.html"
          done
          for route in skincare cleanser toner serum moisturizer sunscreen makeup lip-care hair-care body-care face-mist essence; do
            mkdir -p "$DIST/categories/$route"
            cp "$DIST/index.html" "$DIST/categories/$route/index.html"
          done
          for route in build-a-simple-skincare-routine daily-sun-protection-guide care-for-dry-skin oily-skin-without-overwashing understanding-acne-prone-skin healthy-hair-care-habits makeup-prep-for-a-smooth-finish beauty-parlour-appointment-guide; do
            mkdir -p "$DIST/journal/$route"
            cp "$DIST/index.html" "$DIST/journal/$route/index.html"
          done
          mkdir -p "$DIST/product/6480fe53-e5d3-404b-8203-385741cd8020"
          cp "$DIST/index.html" "$DIST/product/6480fe53-e5d3-404b-8203-385741cd8020/index.html"
          cp "$DIST/index.html" "$DIST/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./golden-touch 2/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
