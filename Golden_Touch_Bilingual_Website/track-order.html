<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Touch | Track Order</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#0b0b0b;color:#f7f2e8;font:16px Arial}.wrap{max-width:600px;margin:35px auto;padding:20px}.card{background:#171717;border:1px solid #59472a;border-radius:16px;padding:24px}h1,h2{color:#d5ad62}label{display:block;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:12px;background:#080808;color:white;border:1px solid #59472a;border-radius:8px}button{padding:12px 15px;margin-top:12px;border:0;border-radius:8px;background:#d5ad62;font-weight:bold;cursor:pointer}.muted{color:#bbb;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090909;padding:14px;border-radius:8px}a{color:#e4c47d}</style></head><body><main class="wrap"><div class="card"><h1>GOLDEN TOUCH</h1><h2>Track Your Order</h2><p class="muted">Enter the tracking code received after checkout and the same phone number used for the order.</p><label>Tracking code</label><input id="code" placeholder="GT-XXXXXXXXXX"><label>Phone number</label><input id="phone" placeholder="01XXXXXXXXX"><button onclick="track()">Check Order</button><pre id="result">Your order status will appear here.</pre><a href="index.html">Back to Shop</a></div></main><script>const db=window.supabase.createClient(window.GT_SUPABASE_URL,window.GT_SUPABASE_ANON_KEY);async function track(){const {data,error}=await db.rpc('track_guest_order',{p_tracking_code:document.getElementById('code').value.trim(),p_phone:document.getElementById('phone').value.trim()});document.getElementById('result').textContent=error?error.message:(data?JSON.stringify(data,null,2):'No matching order. Check your code and phone.');}</script></body></html>
